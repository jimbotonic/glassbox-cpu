# Builds the web app and deploys it to Cloudflare Pages.
#
# Pushes to main update the production site; pushes to other branches get
# a preview URL. Until the two secrets below are set, the workflow only
# tests and builds.
#
# One-time setup:
#   1. Create the Pages project (production branch: main), in the
#      Cloudflare dashboard or with
#        npx wrangler pages project create glassbox --production-branch main
#   2. In the GitHub repo, Settings > Secrets and variables > Actions, add
#        CLOUDFLARE_API_TOKEN   an API token with "Cloudflare Pages: Edit"
#        CLOUDFLARE_ACCOUNT_ID  shown in the dashboard sidebar

name: Deploy web

on:
  push:
  workflow_dispatch:

concurrency:
  group: deploy-web-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PAGES_PROJECT: glassbox

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.50.0
          cache: true

      - run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Test
        run: flutter test

      - name: Build
        run: flutter build web --release

      - uses: actions/upload-artifact@v4
        with:
          name: web
          path: build/web
          retention-days: 7

  deploy:
    needs: build
    runs-on: ubuntu-latest
    env:
      HAS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
    steps:
      - name: Skip without Cloudflare secrets
        if: env.HAS_TOKEN != 'true'
        run: echo "::notice::CLOUDFLARE_API_TOKEN is not set; built but not deployed."

      - uses: actions/download-artifact@v4
        if: env.HAS_TOKEN == 'true'
        with:
          name: web
          path: build/web

      - name: Deploy to Cloudflare Pages
        if: env.HAS_TOKEN == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: >-
            pages deploy build/web
            --project-name=${{ env.PAGES_PROJECT }}
            --branch=${{ github.ref_name }}
            --commit-hash=${{ github.sha }}
